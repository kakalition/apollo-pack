name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Catalog is fresh and valid
        run: uv run tools/catalog.py check

  skills:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: daily-insight
            requirements: skills/daily-insight/requirements.txt
          - skill: habit-tracker
            requirements: ""
          - skill: journal
            requirements: ""
          - skill: personal-finance
            requirements: ""
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Create environment
        run: uv venv --python 3.12
      - name: Install optional dependencies
        if: matrix.requirements != ''
        run: uv pip install -r "${{ matrix.requirements }}"
      - name: Smoke test ${{ matrix.skill }}
        run: PY=.venv/bin/python bash "skills/${{ matrix.skill }}/tests/smoke.sh"

  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/nanobot-live-status
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Create environment and install plugin
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
