name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Catalog is fresh and valid
        run: uv run tools/catalog.py check

  skills:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill: daily-insight
            requirements: skills/daily-insight/requirements.txt
          - skill: habit-tracker
            requirements: ""
          - skill: journal
            requirements: ""
          - skill: personal-finance
            requirements: ""
          - skill: pdf-creator
            requirements: skills/pdf-creator/requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create environment
        run: uv venv --python 3.12
      - name: Install optional dependencies
        if: matrix.requirements != ''
        run: uv pip install -r "${{ matrix.requirements }}"
      - name: Smoke test ${{ matrix.skill }}
        run: PY=.venv/bin/python bash "skills/${{ matrix.skill }}/tests/smoke.sh"

  charting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: skills/charting/package-lock.json
      - name: Install pinned Node dependencies
        run: npm ci --prefix skills/charting
      - name: Build the chart bundle
        run: node skills/charting/scripts/build.mjs
      - name: Install Chromium
        run: npx --prefix skills/charting playwright install --with-deps chromium
      - name: Smoke test charting
        run: bash skills/charting/tests/smoke.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
