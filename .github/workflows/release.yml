name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Catalog is fresh
        run: uv run tools/catalog.py check
      - name: Zip skills
        run: |
          mkdir -p dist
          for skill in skills/*/; do
            id="$(basename "$skill")"
            (cd skills && zip -r "../dist/${id}.zip" "$id" -x '*/.gitignore')
          done
      - name: Publish release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/* \
            catalog.json
