[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nanobot-live-status"
version = "0.1.0"
description = "Show one rotating live-status sentence while a nanobot turn runs (Telegram)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Kaka", email = "kakalition@gmail.com" }]
keywords = ["nanobot", "telegram", "plugin", "status", "progress", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
    "nanobot-ai>=0.3.5,<0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/kakalition/apollo-pack"
Repository = "https://github.com/kakalition/apollo-pack/tree/main/plugins/nanobot-live-status"
Issues = "https://github.com/kakalition/apollo-pack/issues"
Changelog = "https://github.com/kakalition/apollo-pack/blob/main/plugins/nanobot-live-status/CHANGELOG.md"

[project.entry-points."nanobot.tools"]
live_status = "nanobot_live_status.tool:LiveStatusTool"

[project.scripts]
nanobot-live-status = "nanobot_live_status.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobot_live_status"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["nanobot", "nanobot.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nanobot_live_status.tool"
disallow_subclassing_any = false
